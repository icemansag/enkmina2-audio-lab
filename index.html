<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENKMINA2 AUDIO LAB</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --panel-bg: #161922;
            --panel-border: #262c3a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 15px;
        }

        header h1 {
            font-size: 1.5rem;
            letter-spacing: 1px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1 span {
            color: var(--accent);
            font-size: 0.9rem;
            background: rgba(59, 130, 246, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .main-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            flex: 1;
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel h2 {
            font-size: 1.1rem;
            color: #fff;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 8px;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: #374151;
        }
        .btn-secondary:hover {
            background-color: #4b5563;
        }

        .btn-danger {
            background-color: var(--danger);
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-label {
            border: 2px dashed var(--panel-border);
            padding: 20px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            transition: border-color 0.2s, color 0.2s;
        }

        .file-upload-label:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        .workspace {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .visualizer-container {
            background: #000;
            border-radius: 6px;
            border: 1px solid var(--panel-border);
            position: relative;
            height: 180px;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--panel-border);
            flex: 1;
            min-width: 140px;
        }

        .control-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .control-group label span {
            color: var(--text-main);
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        select {
            background: #1f2937;
            color: white;
            border: 1px solid var(--panel-border);
            padding: 8px;
            border-radius: 4px;
            width: 100%;
        }

        .meters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .meter-box {
            background: #000;
            border: 1px solid var(--panel-border);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .meter-box .val {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--success);
            margin-top: 4px;
        }

        .status-bar {
            font-size: 0.85rem;
            color: var(--text-muted);
            padding: 5px 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            border-left: 3px solid var(--accent);
        }

        .effects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>ENKMINA2 AUDIO LAB <span>V2 Professional Suite</span></h1>
        <div id="file-info" class="status-bar">Ningún archivo cargado</div>
    </header>

    <div class="main-container">
        <!-- Panel Izquierdo: Archivo y Master -->
        <div class="panel">
            <h2>1. Importar Audio</h2>
            <label class="file-upload-label">
                📂 Seleccionar archivo audio
                <input type="file" id="audio-file-input" accept="audio/*">
            </label>

            <h2>2. Reproducción</h2>
            <div style="display: flex; gap: 10px;">
                <button class="btn" id="play-btn" disabled>▶ Reproducir</button>
                <button class="btn btn-secondary" id="stop-btn" disabled>⏹ Stop</button>
            </div>
            
            <div class="control-group">
                <label>Volumen Master <span id="vol-val">100%</span></label>
                <input type="range" id="master-volume" min="0" max="1.5" step="0.01" value="1">
            </div>

            <div class="control-group">
                <label>Modo A/B</label>
                <button class="btn btn-secondary" id="bypass-btn">Bypass: OFF</button>
            </div>

            <h2>3. Exportar Audio</h2>
            <div class="control-group">
                <label>Formato WAV</label>
                <select id="export-bitdepth">
                    <option value="16">WAV PCM 16-bit</option>
                    <option value="24" selected>WAV PCM 24-bit</option>
                    <option value="32">WAV 32-bit Float</option>
                </select>
            </div>
            <button class="btn" id="export-btn" disabled>💾 Exportar Procesado</button>
        </div>

        <!-- Panel Derecho: Visualizador, Medidores y Efectos -->
        <div class="workspace">
            <div class="panel">
                <h2>Analizador Espectral y Forma de Onda</h2>
                <div class="visualizer-container">
                    <canvas id="visualizer"></canvas>
                </div>
                <div class="meters-grid">
                    <div class="meter-box">
                        <small>Pico Máx</small>
                        <div class="val" id="meter-peak">-∞ dB</div>
                    </div>
                    <div class="meter-box">
                        <small>RMS</small>
                        <div class="val" id="meter-rms">-∞ dB</div>
                    </div>
                    <div class="meter-box">
                        <small>Sample Rate</small>
                        <div class="val" id="meter-sr">-</div>
                    </div>
                    <div class="meter-box">
                        <small>Duración</small>
                        <div class="val" id="meter-dur">-</div>
                    </div>
                </div>
            </div>

            <!-- Cadena de Efectos -->
            <div class="panel">
                <h2>Cadena de Mastering & Procesamiento DSP</h2>
                <div class="effects-grid">
                    
                    <!-- EQ Paramétrico -->
                    <div class="control-group">
                        <label>EQ: Graves (Low Shelf) <span id="eq-low-val">0 dB</span></label>
                        <input type="range" id="eq-low" min="-15" max="15" step="0.5" value="0">
                    </div>
                    <div class="control-group">
                        <label>EQ: Medios (Peaking) <span id="eq-mid-val">0 dB</span></label>
                        <input type="range" id="eq-mid" min="-15" max="15" step="0.5" value="0">
                    </div>
                    <div class="control-group">
                        <label>EQ: Agudos (High Shelf) <span id="eq-high-val">0 dB</span></label>
                        <input type="range" id="eq-high" min="-15" max="15" step="0.5" value="0">
                    </div>

                    <!-- Compresor -->
                    <div class="control-group">
                        <label>Compresor: Threshold <span id="comp-thresh-val">-24 dB</span></label>
                        <input type="range" id="comp-thresh" min="-60" max="0" step="1" value="-24">
                    </div>
                    <div class="control-group">
                        <label>Compresor: Ratio <span id="comp-ratio-val">3:1</span></label>
                        <input type="range" id="comp-ratio" min="1" max="20" step="0.5" value="3">
                    </div>

                    <!-- Saturación -->
                    <div class="control-group">
                        <label>Saturación (Drive) <span id="sat-drive-val">1.0</span></label>
                        <input type="range" id="sat-drive" min="1" max="10" step="0.1" value="1">
                    </div>

                    <!-- Limitador -->
                    <div class="control-group">
                        <label>Limiter Ceiling <span id="lim-ceiling-val">-0.3 dB</span></label>
                        <input type="range" id="lim-ceiling" min="-3" max="0" step="0.1" value="-0.3">
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let audioBuffer = null;
        let sourceNode = null;
        let gainNode = null;
        let analyserNode = null;
        let biquadLow = null, biquadMid = null, biquadHigh = null;
        let compressorNode = null;
        let saturationNode = null;
        let limiterNode = null;

        let isPlaying = false;
        let isBypassed = false;
        let startTime = 0;
        let pauseOffset = 0;
        let originalFileName = "audio_procesado.wav";

        const fileInput = document.getElementById('audio-file-input');
        const fileInfo = document.getElementById('file-info');
        const playBtn = document.getElementById('play-btn');
        const stopBtn = document.getElementById('stop-btn');
        const bypassBtn = document.getElementById('bypass-btn');
        const exportBtn = document.getElementById('export-btn');
        const masterVolume = document.getElementById('master-volume');
        const volVal = document.getElementById('vol-val');
        
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');

        // Inicializar AudioContext al primer gesto del usuario
        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            initAudioContext();
            originalFileName = file.name.substring(0, file.name.lastIndexOf('.')) || 'audio';

            fileInfo.textContent = `Cargando archivo: ${file.name}...`;
            const arrayBuffer = await file.arrayBuffer();
            
            try {
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                fileInfo.textContent = `Archivo listo: ${file.name} (${audioBuffer.duration.toFixed(2)}s, ${audioBuffer.sampleRate}Hz)`;
                playBtn.disabled = false;
                stopBtn.disabled = false;
                exportBtn.disabled = false;
                
                document.getElementById('meter-sr').textContent = `${audioBuffer.sampleRate} Hz`;
                document.getElementById('meter-dur').textContent = `${audioBuffer.duration.toFixed(2)}s`;
                
                analyzeStaticBuffer(audioBuffer);
            } catch (err) {
                fileInfo.textContent = `Error al decodificar el archivo de audio.`;
                console.error(err);
            }
        });

        function setupAudioGraph() {
            if (sourceNode) {
                try { sourceNode.stop(); } catch(e){}
                sourceNode.disconnect();
            }

            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = audioBuffer;

            // Nodos de efectos
            biquadLow = audioCtx.createBiquadFilter();
            biquadLow.type = 'lowshelf';
            biquadLow.frequency.value = 250;
            biquadLow.gain.value = parseFloat(document.getElementById('eq-low').value);

            biquadMid = audioCtx.createBiquadFilter();
            biquadMid.type = 'peaking';
            biquadMid.frequency.value = 1500;
            biquadMid.Q.value = 1.0;
            biquadMid.gain.value = parseFloat(document.getElementById('eq-mid').value);

            biquadHigh = audioCtx.createBiquadFilter();
            biquadHigh.type = 'highshelf';
            biquadHigh.frequency.value = 4000;
            biquadHigh.gain.value = parseFloat(document.getElementById('eq-high').value);

            compressorNode = audioCtx.createDynamicsCompressor();
            compressorNode.threshold.value = parseFloat(document.getElementById('comp-thresh').value);
            compressorNode.ratio.value = parseFloat(document.getElementById('comp-ratio').value);
            compressorNode.attack.value = 0.003;
            compressorNode.release.value = 0.25;

            // Nodo de saturación WaveShaper
            saturationNode = audioCtx.createWaveShaper();
            updateSaturationCurve(parseFloat(document.getElementById('sat-drive').value));

            analyserNode = audioCtx.createAnalyser();
            analyserNode.fftSize = 2048;

            gainNode = audioCtx.createGain();
            gainNode.gain.value = parseFloat(masterVolume.value);

            if (isBypassed) {
                // Cadena limpia con bypass de efectos
                sourceNode.connect(analyserNode);
                analyserNode.connect(gainNode);
                gainNode.connect(audioCtx.destination);
            } else {
                // Cadena completa de mastering
                sourceNode.connect(biquadLow);
                biquadLow.connect(biquadMid);
                biquadMid.connect(biquadHigh);
                biquadHigh.connect(compressorNode);
                compressorNode.connect(saturationNode);
                saturationNode.connect(analyserNode);
                analyserNode.connect(gainNode);
                gainNode.connect(audioCtx.destination);
            }

            sourceNode.onended = () => {
                if (isPlaying) stopPlayback();
            };
        }

        function updateSaturationCurve(amount) {
            if (!audioCtx) return;
            const k = typeof amount === 'number' ? amount : 1;
            const n_samples = 44100;
            const curve = new Float32Array(n_samples);
            const deg = Math.PI / 180;
            for (let i = 0; i < n_samples; ++i) {
                let x = (i * 2) / n_samples - 1;
                curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
            }
            saturationNode.curve = curve;
        }

        playBtn.addEventListener('click', () => {
            if (!audioBuffer) return;
            initAudioContext();

            if (isPlaying) {
                stopPlayback();
            }

            setupAudioGraph();
            sourceNode.start(0, pauseOffset);
            startTime = audioCtx.currentTime - pauseOffset;
            isPlaying = true;
            playBtn.textContent = '⏸ Pausar';
            visualize();
        });

        function stopPlayback() {
            if (sourceNode && isPlaying) {
                try { sourceNode.stop(); } catch(e){}
                pauseOffset = 0;
                isPlaying = false;
                playBtn.textContent = '▶ Reproducir';
            }
        }

        stopBtn.addEventListener('click', () => {
            stopPlayback();
            pauseOffset = 0;
        });

        masterVolume.addEventListener('input', (e) => {
            const val = e.target.value;
            volVal.textContent = `${Math.round(val * 100)}%`;
            if (gainNode) gainNode.gain.value = parseFloat(val);
        });

        bypassBtn.addEventListener('click', () => {
            isBypassed = !isBypassed;
            bypassBtn.textContent = `Bypass: ${isBypassed ? 'ON' : 'OFF'}`;
            bypassBtn.style.background = isBypassed ? 'var(--success)' : '#374151';
            if (isPlaying) {
                const currentPos = audioCtx.currentTime - startTime;
                pauseOffset = currentPos % audioBuffer.duration;
                setupAudioGraph();
                sourceNode.start(0, pauseOffset);
                startTime = audioCtx.currentTime - pauseOffset;
            }
        });

        // Controles de efectos en tiempo real
        document.getElementById('eq-low').addEventListener('input', (e) => {
            document.getElementById('eq-low-val').textContent = `${e.target.value} dB`;
            if (biquadLow) biquadLow.gain.value = parseFloat(e.target.value);
        });
        document.getElementById('eq-mid').addEventListener('input', (e) => {
            document.getElementById('eq-mid-val').textContent = `${e.target.value} dB`;
            if (biquadMid) biquadMid.gain.value = parseFloat(e.target.value);
        });
        document.getElementById('eq-high').addEventListener('input', (e) => {
            document.getElementById('eq-high-val').textContent = `${e.target.value} dB`;
            if (biquadHigh) biquadHigh.gain.value = parseFloat(e.target.value);
        });
        document.getElementById('comp-thresh').addEventListener('input', (e) => {
            document.getElementById('comp-thresh-val').textContent = `${e.target.value} dB`;
            if (compressorNode) compressorNode.threshold.value = parseFloat(e.target.value);
        });
        document.getElementById('comp-ratio').addEventListener('input', (e) => {
            document.getElementById('comp-ratio-val').textContent = `${e.target.value}:1`;
            if (compressorNode) compressorNode.ratio.value = parseFloat(e.target.value);
        });
        document.getElementById('sat-drive').addEventListener('input', (e) => {
            document.getElementById('sat-drive-val').textContent = `${e.target.value}`;
            updateSaturationCurve(parseFloat(e.target.value));
        });

        // Analizador visual
        function visualize() {
            if (!isPlaying) return;
            
            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            function draw() {
                if (!isPlaying) return;
                requestAnimationFrame(draw);

                analyserNode.getByteFrequencyData(dataArray);

                canvasCtx.fillStyle = '#0f1115';
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

                const barWidth = (canvas.width / bufferLength) * 2.5;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const barHeight = (dataArray[i] / 255) * canvas.height;

                    canvasCtx.fillStyle = `rgb(${dataArray[i] + 50}, 130, 246)`;
                    canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

                    x += barWidth + 1;
                }
            }
            draw();
        }

        function analyzeStaticBuffer(buffer) {
            const channelData = buffer.getChannelData(0);
            let sumSquares = 0;
            let peak = 0;

            for (let i = 0; i < channelData.length; i++) {
                const sample = channelData[i];
                const abs = Math.abs(sample);
                if (abs > peak) peak = abs;
                sumSquares += sample * sample;
            }

            const rms = Math.sqrt(sumSquares / channelData.length);
            const peakDb = peak === 0 ? -100 : 20 * Math.log10(peak);
            const rmsDb = rms === 0 ? -100 : 20 * Math.log10(rms);

            document.getElementById('meter-peak').textContent = `${peakDb.toFixed(1)} dB`;
            document.getElementById('meter-rms').textContent = `${rmsDb.toFixed(1)} dB`;
        }

        // Exportación procesada usando OfflineAudioContext
        exportBtn.addEventListener('click', async () => {
            if (!audioBuffer) return;
            exportBtn.textContent = '⏳ Renderizando exportación...';
            exportBtn.disabled = true;

            const offlineCtx = new OfflineAudioContext(
                audioBuffer.numberOfChannels,
                audioBuffer.length,
                audioBuffer.sampleRate
            );

            const source = offlineCtx.createBufferSource();
            source.buffer = audioBuffer;

            // Replicar cadena de efectos en offline context
            const oLow = offlineCtx.createBiquadFilter();
            oLow.type = 'lowshelf';
            oLow.frequency.value = 250;
            oLow.gain.value = parseFloat(document.getElementById('eq-low').value);

            const oMid = offlineCtx.createBiquadFilter();
            oMid.type = 'peaking';
            oMid.frequency.value = 1500;
            oMid.Q.value = 1.0;
            oMid.gain.value = parseFloat(document.getElementById('eq-mid').value);

            const oHigh = offlineCtx.createBiquadFilter();
            oHigh.type = 'highshelf';
            oHigh.frequency.value = 4000;
            oHigh.gain.value = parseFloat(document.getElementById('eq-high').value);

            const oComp = offlineCtx.createDynamicsCompressor();
            oComp.threshold.value = parseFloat(document.getElementById('comp-thresh').value);
            oComp.ratio.value = parseFloat(document.getElementById('comp-ratio').value);
            oComp.attack.value = 0.003;
            oComp.release.value = 0.25;

            const oSat = offlineCtx.createWaveShaper();
            const amount = parseFloat(document.getElementById('sat-drive').value);
            const curve = new Float32Array(44100);
            const deg = Math.PI / 180;
            for (let i = 0; i < 44100; ++i) {
                let x = (i * 2) / 44100 - 1;
                curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
            }
            oSat.curve = curve;

            if (isBypassed) {
                source.connect(offlineCtx.destination);
            } else {
                source.connect(oLow);
                oLow.connect(oMid);
                oMid.connect(oHigh);
                oHigh.connect(oComp);
                oComp.connect(oSat);
                oSat.connect(offlineCtx.destination);
            }

            source.start(0);
            const renderedBuffer = await offlineCtx.startRendering();

            const bitDepth = parseInt(document.getElementById('export-bitdepth').value);
            const wavBlob = bufferToWav(renderedBuffer, bitDepth);
            
            const url = URL.createObjectURL(wavBlob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `${originalFileName}_mastered.wav`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);

            exportBtn.textContent = '💾 Exportar Procesado';
            exportBtn.disabled = false;
        });

        // Generador de WAV PCM (16, 24 o 32-bit float)
        function bufferToWav(buffer, bitDepth) {
            const numOfChan = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const length = buffer.length;
            
            let bytesPerSample = 2; // 16-bit
            if (bitDepth === 24) bytesPerSample = 3;
            if (bitDepth === 32) bytesPerSample = 4;

            const blockAlign = numOfChan * bytesPerSample;
            const byteRate = sampleRate * blockAlign;
            const dataSize = length * blockAlign;
            const bufferSize = 44 + dataSize;

            const arrayBuffer = new ArrayBuffer(bufferSize);
            const view = new DataView(arrayBuffer);

            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            // RIFF chunk descriptor
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(view, 8, 'WAVE');

            // fmt sub-chunk
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); // SubChunk1Size (16 for PCM)
            view.setUint32(20, bitDepth === 32 ? 3 : 1, true); // AudioFormat (1 = PCM, 3 = IEEE Float)
            view.setUint16(22, numOfChan, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);

            // data sub-chunk
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            // Escribir muestras de audio intercaladas
            const channels = [];
            for (let i = 0; i < numOfChan; i++) {
                channels.push(buffer.getChannelData(i));
            }

            let offset = 44;
            for (let i = 0; i < length; i++) {
                for (let ch = 0; ch < numOfChan; ch++) {
                    let sample = Math.max(-1, Math.min(1, channels[ch][i]));
                    
                    if (bitDepth === 16) {
                        let intSample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                        view.setInt16(offset, intSample, true);
                        offset += 2;
                    } else if (bitDepth === 24) {
                        let intSample = sample < 0 ? sample * 0x800000 : sample * 0x7FFFFF;
                        view.setInt8(offset, intSample & 0xFF);
                        view.setInt8(offset + 1, (intSample >> 8) & 0xFF);
                        view.setInt8(offset + 2, (intSample >> 16) & 0xFF);
                        offset += 3;
                    } else if (bitDepth === 32) {
                        view.setFloat32(offset, sample, true);
                        offset += 4;
                    }
                }
            }

            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }
    </script>
